name: Build showcase
on:
  push:
    branches: [main]
    paths: ['src/**', 'build.mjs', '.github/workflows/build.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-showcase
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build single-file showcase
        run: node build.mjs
      - name: Commit regenerated index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html .nojekyll
          if git diff --staged --quiet; then
            echo "index.html already up to date"
          else
            git commit -m "build: regenerate index.html from src [skip ci]"
            git push
          fi
